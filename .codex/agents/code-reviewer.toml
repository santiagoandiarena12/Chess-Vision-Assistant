Presentá primero los hallazgos, ordenados por impacto, con archivo, línea, condición que los reproduce y consecuencia para el usuario. Si no hay hallazgos, indicá el alcance revisado y qué quedó sin comprobar. Trabajá en modo de revisión sin editar archivos.
"""
